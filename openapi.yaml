openapi: 3.0.3
info:
  title: Помощник учителя API
  version: 0.2.0
  description: |
    Backend API для чат-бота и мини-приложения проверки контрольных
    работ в MAX.

    Мульти-тенантность: все ресурсы (работы, submissions, ученики,
    профили) принадлежат конкретному учителю. `teacher_id` - это
    `user_id` учителя в MAX. Клиент передаёт его в query-параметре
    (или form-data для POST). Валидация MAX initData на бэкенде -
    P1 (задача 37 в 03_tz_backend.md).

    Кросс-тенантный доступ запрещён: попытка чтения/изменения
    чужого ресурса → 403.
servers:
  - url: /api
    description: Через nginx proxy мини-приложения
  - url: http://localhost:8000
    description: Прямое подключение к backend

paths:
  /health:
    get:
      summary: Проверка живости сервиса
      responses:
        "200":
          description: OK

  /works:
    post:
      summary: Создать шаблон работы (тема, задания, эталон)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkTemplateCreate"
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkTemplate"
    get:
      summary: Список шаблонов работ учителя
      parameters:
        - $ref: "#/components/parameters/TeacherId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkTemplate" }

  /works/{work_id}:
    get:
      summary: Получить шаблон работы
      parameters:
        - in: path
          name: work_id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TeacherId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkTemplate" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /submissions:
    post:
      summary: Загрузить фото работы одного ученика
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [teacher_id, work_id, student_id, photos]
              properties:
                teacher_id: { type: string }
                work_id: { type: string }
                student_id: { type: string }
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "202":
          description: Принято на проверку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "403": { $ref: "#/components/responses/Forbidden" }

    get:
      summary: Очередь работ учителя
      parameters:
        - $ref: "#/components/parameters/TeacherId"
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, checked, confirmed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }

  /submissions/{submission_id}:
    get:
      summary: Результат проверки одной работы с разметкой
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TeacherId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /submissions/{submission_id}/review:
    patch:
      summary: Учитель подтверждает или правит вердикт по заданиям
      parameters:
        - in: path
          name: submission_id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TeacherId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherReview" }
      responses:
        "200":
          description: OK
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /students:
    post:
      summary: Создать ученика в классе учителя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentCreate" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
    get:
      summary: Список учеников учителя (опционально по классу)
      parameters:
        - $ref: "#/components/parameters/TeacherId"
        - in: query
          name: class_id
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Student" }

  /students/{student_id}/profile:
    get:
      summary: Долгосрочный профиль ученика (память)
      parameters:
        - in: path
          name: student_id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TeacherId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teachers/{teacher_id}/state:
    get:
      summary: Текущий контекст учителя (выбранная работа и ученик)
      description: |
        Общий стейт для бота и мини-приложения. Когда учитель выбирает
        работу или ученика в MiniApp, состояние сохраняется здесь, и
        бот при получении фото читает то же самое. Наоборот - если
        учитель выбрал через бота, MiniApp увидит.
      parameters:
        - in: path
          name: teacher_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherState" }
    put:
      summary: Установить текущую работу и/или ученика
      parameters:
        - in: path
          name: teacher_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_work_id: { type: string, nullable: true }
                current_student_id: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /classes/{class_id}/dashboard:
    get:
      summary: Агрегированная статистика по классу учителя
      parameters:
        - in: path
          name: class_id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/TeacherId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDashboard" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  parameters:
    TeacherId:
      in: query
      name: teacher_id
      required: true
      description: MAX user_id учителя, вызывающего endpoint
      schema: { type: string }

  responses:
    Forbidden:
      description: Ресурс принадлежит другому учителю
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

  schemas:
    WorkTemplateCreate:
      type: object
      required: [teacher_id, title, grade, tasks]
      properties:
        teacher_id: { type: string }
        title: { type: string, example: "Контрольная №3. Умножение" }
        subject: { type: string, example: "math" }
        grade: { type: integer, example: 3 }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskDefinition" }

    WorkTemplate:
      allOf:
        - $ref: "#/components/schemas/WorkTemplateCreate"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }

    TaskDefinition:
      type: object
      required: [index, statement, expected_answer]
      properties:
        index: { type: integer }
        statement: { type: string }
        expected_answer: { type: string }
        max_points: { type: number, default: 1 }

    StudentCreate:
      type: object
      required: [teacher_id, class_id, display_name, grade]
      properties:
        teacher_id: { type: string }
        class_id: { type: string, example: "3-А" }
        display_name: { type: string, example: "Иванов П." }
        grade: { type: integer, example: 3 }

    Student:
      allOf:
        - $ref: "#/components/schemas/StudentCreate"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }

    TeacherState:
      type: object
      properties:
        teacher_id: { type: string }
        current_work_id: { type: string, nullable: true }
        current_student_id: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    Submission:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string }
        student_id: { type: string }
        status:
          type: string
          enum: [pending, checked, confirmed]
        created_at: { type: string, format: date-time }
        photos:
          type: array
          items: { type: string, description: "относительный URL" }

    SubmissionResult:
      allOf:
        - $ref: "#/components/schemas/Submission"
        - type: object
          properties:
            per_task:
              type: array
              items: { $ref: "#/components/schemas/TaskCheck" }
            total_score: { type: number }
            confidence: { type: number, description: "средняя уверенность модели, 0..1" }

    TaskCheck:
      type: object
      properties:
        task_index: { type: integer }
        student_answer: { type: string }
        expected_answer: { type: string }
        is_correct: { type: boolean }
        confidence: { type: number }
        explanation: { type: string, description: "объяснение ошибки для ученика" }
        reasoning_graph:
          type: array
          description: "шаги решения ученика (если восстановлены)"
          items:
            type: object
            properties:
              step: { type: string }
              ok: { type: boolean }
        photo_boxes:
          type: array
          description: "координаты области с ответом на фото"
          items:
            type: object
            properties:
              photo_index: { type: integer }
              x: { type: number }
              y: { type: number }
              w: { type: number }
              h: { type: number }
        teacher_verdict:
          type: object
          nullable: true
          properties:
            is_correct: { type: boolean }
            comment: { type: string }

    TeacherReview:
      type: object
      properties:
        per_task:
          type: array
          items:
            type: object
            required: [task_index, is_correct]
            properties:
              task_index: { type: integer }
              is_correct: { type: boolean }
              comment: { type: string }

    StudentProfile:
      type: object
      properties:
        student_id: { type: string }
        submissions_count: { type: integer }
        avg_score: { type: number }
        weak_topics:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              error_rate: { type: number }
        recurring_mistakes:
          type: array
          items: { type: string }
        trend:
          type: string
          enum: [improving, stable, regressing]

    ClassDashboard:
      type: object
      properties:
        class_id: { type: string }
        students_count: { type: integer }
        avg_score: { type: number }
        weak_topics:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              error_rate: { type: number }
        students_needing_help:
          type: array
          items:
            type: object
            properties:
              student_id: { type: string }
              reason: { type: string }
